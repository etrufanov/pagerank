[package]
name = "pagerank"
version = "0.1.0"
edition = "2024"
description = "Вычисление метрики PageRank для невзвешенного, ориентированного графа"
readme = "README.md"
repository = "https://github.com/etrufanov/pagerank"

[dependencies]
anyhow = "1.0.102"
bytemuck = "1.25.0"
clap = { version = "4.6.1", features = ["derive"] }
clap-verbosity-flag = "3.0.4"
csv = "1.4.0"
env_logger = "0.11.10"
jiff = "0.2.28"
log = "0.4.32"
memmap2 = "0.9.10"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
tempfile = "3.27.0"
